<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Bild zu CSV (Web)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.1/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script defer src="script.js"></script>
    <style>
        :root {
            --vodafone-rot: #E60000;
            --vodafone-dunkel: #1A1A1A;
            --vodafone-hell: #F5F5F5;
            --white: #FFFFFF;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--vodafone-hell);
            font-family: 'San Francisco', 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
            color: var(--vodafone-dunkel);
        }
        .container {
            max-width: 500px;
            margin: 3em auto 0 auto;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            padding: 2.5em 2em 2em 2em;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: var(--vodafone-rot);
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 0.5em;
            letter-spacing: -1px;
            text-align: center;
        }
        .subtitle {
            color: var(--vodafone-dunkel);
            font-size: 1.1em;
            margin-bottom: 2em;
            text-align: center;
        }
        input[type="file"] {
            margin-bottom: 1.5em;
            font-size: 1em;
        }
        button {
            background: var(--vodafone-rot);
            color: var(--white);
            border: none;
            border-radius: 12px;
            padding: 0.9em 2em;
            font-size: 1.1em;
            font-weight: 600;
            margin: 0.5em 0.5em 0.5em 0;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(230,0,0,0.08);
            transition: background 0.2s, box-shadow 0.2s;
        }
        button:hover, button:focus {
            background: #b80000;
            box-shadow: 0 4px 16px rgba(230,0,0,0.15);
        }
        #progress-bar {
            width: 100%;
            height: 16px;
            background: #eee;
            border-radius: 8px;
            margin: 1em 0 1.5em 0;
            overflow: hidden;
            display: none;
        }
        #progress-bar-inner {
            height: 100%;
            width: 0%;
            background: var(--vodafone-rot);
            border-radius: 8px;
            transition: width 0.2s;
        }
        @media (max-width: 600px) {
            .container {
                max-width: 98vw;
                padding: 1em 0.5em 1.5em 0.5em;
            }
            h1 {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bild zu CSV</h1>
        <div class="subtitle">Lade Bilder hoch und exportiere Adresslisten als CSV.</div>
        <input type="file" id="image-input" accept="image/*" multiple>
        <div id="progress-bar"><div id="progress-bar-inner"></div></div>
        <button id="ocr-btn">Texterkennung starten</button>
        <button id="csv-all" style="display:none;">Alle Adressen in einer CSV</button>
        <button id="csv-strassen" style="display:none;">Pro Straße als ZIP</button>
    </div>
</body>
</html>
