<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Pyür Listen-Konverter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script defer src="script.js"></script>
    <style>
        :root {
            --pyur-red: #E60000;
            --pyur-dark: #333333;
            --pyur-light-gray: #F5F5F5;
            --white: #FFFFFF;
            --shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--pyur-light-gray);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--pyur-dark);
        }

        .container {
            background: var(--white);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 6px solid var(--pyur-red);
        }

        h1 {
            color: var(--pyur-red);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        .file-upload-wrapper {
            margin-bottom: 2rem;
        }

        input[type="file"] {
            font-size: 1rem;
            padding: 10px;
            background: #fafafa;
            border: 2px dashed #ddd;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        input[type="file"]:hover {
            border-color: var(--pyur-red);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }

        button {
            background-color: var(--pyur-red);
            color: var(--white);
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(230, 0, 0, 0.3);
            width: 100%;
        }

        button.secondary {
            background-color: #333; /* Dunklerer Button für ZIP */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        button:active {
            transform: translateY(1px);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>D2D Konverter</h1>
        <p class="subtitle">Wähle deinen Export-Modus</p>
        
        <div class="file-upload-wrapper">
            <input type="file" id="csv-input" accept=".csv">
        </div>

        <div class="btn-group">
            <button id="convert-btn">Alles in eine Liste (CSV)</button>
            <button id="zip-btn" class="secondary">Pro Straße eine Datei (ZIP)</button>
        </div>

        <div class="footer">
            Tool für effizienteres Arbeiten
        </div>
    </div>
</body>
</html>
